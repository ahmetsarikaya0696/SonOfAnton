<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SonOfAnton - Is Akisi Olusturucu</title>
    <base href="/" />
    <link rel="stylesheet" href="css/workflow.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="SonOfAnton.Frontend.styles.css" rel="stylesheet" />
    <!-- Z.Blazor.Diagrams -->
    <!-- Preload as style to avoid 'preload but not used' warnings from some browsers -->
    <link rel="preload" href="_content/Z.Blazor.Diagrams/style.min.css" as="style" />
    <link href="_content/Z.Blazor.Diagrams/style.min.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="loading-container">
            <div class="loading-content">
                <div class="logo-wrapper">
                    <svg class="app-logo" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M100 30L150 100H120L100 70L80 100H50L100 30Z" fill="var(--accent-color)"
                            fill-opacity="0.2" />
                        <path d="M100 30L130 170M100 30L70 170" stroke="var(--accent-color)" stroke-width="4"
                            stroke-linecap="round" />
                        <path d="M70 120H130" stroke="var(--accent-color)" stroke-width="4" stroke-linecap="round" />

                        <circle cx="100" cy="30" r="8" fill="var(--success-color)" />
                        <circle cx="70" cy="120" r="6" fill="var(--accent-color)" />
                        <circle cx="130" cy="120" r="6" fill="var(--accent-color)" />
                        <circle cx="70" cy="170" r="6" fill="var(--accent-color)" />
                        <circle cx="130" cy="170" r="6" fill="var(--accent-color)" />
                    </svg>
                </div>
                <div class="loading-text">SonOfAnton</div>
                <div class="loading-bar-container">
                    <div class="loading-bar"></div>
                </div>
                <div class="loading-percentage">Yükleniyor...</div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Beklenmeyen bir hata olustu.
        <a href="." class="reload">Yeniden Yukle</a>
        <span class="dismiss">X</span>
    </div>
    <!-- Theme Manager -->
    <script src="js/theme.js"></script>
    <!-- SSE Helper -->
    <script src="js/sse-helper.js"></script>
    <!-- Expression Input Interop -->
    <script src="js/expression-input.js"></script>
    <!-- File Upload Interop (Markdown Editor) -->
    <script src="js/fileUpload.js"></script>
    <!-- Clipboard & Keyboard helpers -->
    <script>
        window.clipboardHelper = {
            copy: async function (text) {
                await navigator.clipboard.writeText(text);
            }
        };
    </script>
    <!-- Z.Blazor.Diagrams JavaScript -->
    <script src="_content/Z.Blazor.Diagrams/script.min.js"></script>
    <!-- OIDC Authentication -->
    <script src="_content/Microsoft.AspNetCore.Components.WebAssembly.Authentication/AuthenticationService.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
