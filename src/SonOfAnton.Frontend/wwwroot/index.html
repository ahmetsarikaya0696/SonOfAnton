<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SonOfAnton - Is Akisi Olusturucu</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/workflow.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="SonOfAnton.Frontend.styles.css" rel="stylesheet" />
    <!-- Z.Blazor.Diagrams -->
    <link href="_content/Z.Blazor.Diagrams/style.min.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="loading-container">
            <svg class="loading-progress">
                <circle r="40%" cx="50%" cy="50%" />
                <circle r="40%" cx="50%" cy="50%" />
            </svg>
            <div class="loading-progress-text">Yukleniyor...</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Beklenmeyen bir hata olustu.
        <a href="." class="reload">Yeniden Yukle</a>
        <span class="dismiss">X</span>
    </div>
    <!-- SSE Helper -->
    <script src="js/sse-helper.js"></script>
    <!-- Clipboard & Keyboard helpers -->
    <script>
        window.clipboardHelper = {
            copy: async function (text) {
                await navigator.clipboard.writeText(text);
            }
        };
    </script>
    <!-- Z.Blazor.Diagrams JavaScript -->
    <script src="_content/Z.Blazor.Diagrams/script.min.js"></script>
    <!-- OIDC Authentication -->
    <script src="_content/Microsoft.AspNetCore.Components.WebAssembly.Authentication/AuthenticationService.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
